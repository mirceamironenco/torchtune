# Config for multi-device full finetuning in full_finetune_distributed.py
# using a Qwen3 MoE 235B-A22B model
#
# This config assumes that you've run the following command before launching:
#   tune download Qwen/Qwen3-235B-A22B-Instruct-2507 --output-dir /tmp/Qwen3-235B-A22B-Instruct-2507
#
# Full finetuning of Qwen3 MoE 235B-A22B requires a multi-node setting.
# An example slurm script can be found under recipes/full_finetune_multinode.slurm.
# Example usage:
#   sbatch full_finetune_multinode.slurm
#
# This config is intended for 32+ 80GB GPUs.

output_dir: /tmp/torchtune/qwen3_moe_235B_A22B/full # /tmp may be deleted by your system. Change it to your preference.

# Model arguments
model:
  _component_: torchtune.models.qwen3.qwen3_moe_235b_a22b_instruct

# Tokenizer
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: /tmp/Qwen3-235B-A22B-Instruct-2507/vocab.json
  merges_file: /tmp/Qwen3-235B-A22B-Instruct-2507/merges.txt
  max_seq_len: 2048

# Checkpointer
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /tmp/Qwen3-235B-A22B-Instruct-2507
  checkpoint_files:
    filename_format: model-{}-of-{}.safetensors
    max_filename: "00118"
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN3_MOE
resume_from_checkpoint: False

# Dataset
dataset:
  _component_: torchtune.datasets.alpaca_cleaned_dataset
  packed: False # True increases speed
seed: null
shuffle: True

# Fine-tuning arguments
epochs: 1
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 1 # Use to increase effective batch size
optimizer:
  _component_: torch.optim.AdamW
  fused: False
  lr: 2e-5
optimizer_in_bwd: True # True saves memory. Requires gradient_accumulation_steps=1
loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# Training env
device: cuda

# Memory management / performance
enable_activation_checkpointing: True # True reduces memory
enable_activation_offloading: False # True reduces memory
custom_sharded_layers: ["tok_embeddings", "output"] # Layers to shard separately (useful for large vocab size models). Lower Memory, but lower speed.
dtype: bf16
clip_grad_norm: null
compile: False # torch.compile the model + loss, True increases speed + decreases memory

# Logging
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs
log_every_n_steps: 1
log_peak_memory_stats: True
log_level: INFO # DEBUG, WARN, etc.

# Profiler (disabled)
profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: False

  #Output directory of trace artifacts
  output_dir: ${output_dir}/profiling_outputs

  #`torch.profiler.ProfilerActivity` types to trace
  cpu: True
  cuda: True

  #trace options passed to `torch.profiler.profile`
  profile_memory: False
  with_stack: False
  record_shapes: True
  with_flops: False

  # `torch.profiler.schedule` options:
  # wait_steps -> wait, warmup_steps -> warmup, active_steps -> active, num_cycles -> repeat
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
